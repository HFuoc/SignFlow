name: Expand uploaded source

on:
  push:
    branches:
      - upload/source-staging
    paths:
      - .upload/READY

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: upload/source-staging
          fetch-depth: 0

      - name: Reassemble and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk-*.b64 | base64 --decode > /tmp/smart-gloves-source.zip
          unzip -o /tmp/smart-gloves-source.zip -d .
          rm -rf .upload
          rm -f .github/workflows/unpack-source.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Expand complete Direction B source tree"
          git push origin HEAD:upload/source-staging
