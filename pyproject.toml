[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartglove-dataset-studio"
version = "0.1.1"
description = "Desktop sensor data acquisition foundation for the SmartGlove dataset"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyqtgraph>=0.13.7,<0.15",
  "pywebview>=5.4,<7",
  "PySide6>=6.8,<7",
  "uvicorn>=0.34,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
]

[project.scripts]
smartglove-collector = "app.desktop_collector.main:main"
smartglove-collector-web = "app.desktop_collector.shell:main"

[tool.setuptools.packages.find]
include = ["app", "app.desktop_collector*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
